<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录</title>
    <style>
        /* 重置样式 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* 视频背景容器（固定在最底层） */
        .video-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: -1;
        }

        .video-background video {
            width: 100%;
            height: 100%;
            object-fit: cover;  /* 铺满且保持比例 */
        }

        /* 表单容器样式：居中、半透明、圆角 */
        .form-container {
            position: relative;
            width: 350px;
            margin: 15vh auto;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(8px);
            padding: 30px 25px;
            border-radius: 16px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            text-align: center;
        }

        .form-group {
            margin-bottom: 18px;
            text-align: left;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
            color: #333;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 14px;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            background-color: #45a049;
        }

        .switch-btn {
            background: none;
            border: none;
            color: #2196F3;
            cursor: pointer;
            margin-top: 12px;
            font-size: 14px;
            text-decoration: underline;
        }

        .switch-btn:hover {
            color: #0b7dda;
            background: none;
        }

        /* 辅助隐藏类 */
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <!-- 视频背景（保持不变） -->
    <div class="video-background">
        <video autoplay loop muted playsinline>
            <!-- 替换成你自己的视频路径 -->
            <source src="../images/3.mp4" type="video/mp4">
            您的浏览器不支持 video 标签。
        </video>
    </div>

    <!-- 登录表单 -->
    <div id="loginForm" class="form-container">
        <h2>登录</h2>
        <form>
            <div class="form-group">
                <label>用户名</label>
                <input type="text" id="loginUsername" placeholder="请输入用户名">
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" id="loginPassword" placeholder="请输入密码">
            </div>
            <button type="button" id="doLogin">登录</button>
        </form>
        <button class="switch-btn" id="toRegisterBtn">没有账号？去注册</button>
    </div>

    <!-- 注册表单（初始隐藏） -->
    <div id="registerForm" class="form-container hidden">
        <h2>注册</h2>
        <form>
            <div class="form-group">
                <label>用户名</label>
                <input type="text" id="regUsername" placeholder="用户名">
            </div>
            <div class="form-group">
                <label>手机号</label>
                <input type="text" id="regPhone" placeholder="手机号">
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" id="regPassword" placeholder="密码">
            </div>
            <div class="form-group">
                <label>确认密码</label>
                <input type="password" id="regConfirmPwd" placeholder="确认密码">
            </div>
            <button type="button" id="doRegister">注册</button>
        </form>
        <button class="switch-btn" id="toLoginBtn">已有账号？去登录</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="../js/showLogin.js"></script>
    <script src="../js/showRegister.js"></script>
    <script src="../js/userLogin.js"></script>
    <script src="../js/userRegister.js"></script>
</body>
</html>
